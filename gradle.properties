# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# JDK sur lequel Gradle démarre pour CE projet (le JDK 25 par défaut de la machine n'est pas supporté
# par Gradle 8.14.3). N'affecte pas le JAVA_HOME système.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.8-hotspot

group=com.cobblesync

# Minecraft / mappings — alignés avec le repo Cobblemon local (../cobblemon)
mc_version=1.21.1
parchment_version=2024.07.28@zip
java_version=21

# Mod
mod_id=cobblesync
mod_version=0.1.0

# Fabric — mêmes versions que celles utilisées par Cobblemon pour MC 1.21.1
fabric_loader_version=0.17.2
fabric_api_version=0.116.6+1.21.1
fabric_kotlin_version=1.13.6+kotlin.2.2.20
kotlin_version=2.2.20

# Dépendance Cobblemon (coordonnées Modrinth Maven : maven.modrinth:cobblemon:<version_number>,
# vérifié via l'API Modrinth — le suffixe +mc_version ne fait PAS partie du version_number réel).
cobblemon_version=1.7.3
